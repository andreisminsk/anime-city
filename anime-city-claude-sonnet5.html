<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>🌸 Anime City 🌸</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; width:100%; height:100%; background:#ffd6e8; }
  canvas { display:block; touch-action:none; }

  #hud {
    position:fixed; left:14px; bottom:14px; z-index:10;
    background: linear-gradient(135deg, rgba(255,214,232,0.92), rgba(255,240,246,0.92));
    border:2px solid #ff9ecb;
    border-radius:18px;
    padding:12px 16px;
    color:#8a3b5e;
    font-family:'Comic Sans MS','Marker Felt', system-ui, sans-serif;
    font-size:13px;
    line-height:1.55;
    box-shadow:0 8px 22px rgba(200,80,140,0.35), inset 0 0 0 2px rgba(255,255,255,0.5);
    pointer-events:none;
    max-width:250px;
  }
  #hud b { color:#d6316c; }
  #hud .hud-title { font-size:15px; font-weight:bold; margin-bottom:6px; color:#c72466; }

  #badge {
    position:fixed; top:14px; right:14px; z-index:10;
    background: linear-gradient(135deg, #ffd0e6, #ffe8f2);
    border:2px solid #ff8fc4;
    border-radius:22px;
    padding:10px 20px;
    color:#c1245c;
    font-family:'Comic Sans MS','Marker Felt', system-ui, sans-serif;
    font-weight:bold;
    font-size:16px;
    letter-spacing:0.5px;
    box-shadow:0 6px 18px rgba(200,80,140,0.35), inset 0 0 0 2px rgba(255,255,255,0.6);
    pointer-events:none;
  }

  #loading {
    position:fixed; inset:0; z-index:100;
    background: linear-gradient(180deg,#bcd7ff 0%, #ffd6ec 55%, #ffe9c9 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Comic Sans MS','Marker Felt', system-ui, sans-serif;
    color:#a83b6e;
    transition: opacity 0.6s ease;
  }
  #loading h1 { font-size:34px; margin:0 0 10px 0; text-shadow:0 2px 0 #fff; }
  #loading p { font-size:15px; opacity:0.8; }
  .fade-out { opacity:0; pointer-events:none; }
</style>
</head>
<body>

<div id="loading">
  <h1>🌸 Anime City 🌸</h1>
  <p>Loading the city... please wait</p>
</div>

<div id="badge">🌸 ANIME CITY 🌸</div>

<div id="hud">
  <div class="hud-title">Controls</div>
  <b>W / S</b> — walk forward / backward<br/>
  <b>A / D</b> — turn right / left (30°/s, hold)<br/>
  <b>Shift</b> — hold to run<br/>
  <b>Mouse drag</b> — rotate camera<br/>
  <b>Scroll</b> — zoom camera<br/>
  <b>Touch drag</b> — rotate camera (mobile)
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";

/* ============================================================
   BASIC SETUP
   ============================================================ */
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 500);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const clock = new THREE.Clock();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================================================
   TOON GRADIENT MAP (cel-shading steps)
   ============================================================ */
function createToonGradient() {
  const canvas = document.createElement("canvas");
  canvas.width = 4; canvas.height = 1;
  const ctx = canvas.getContext("2d");
  // 4 hard steps, dark -> light
  const steps = [70, 140, 200, 255];
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = `rgb(${steps[i]},${steps[i]},${steps[i]})`;
    ctx.fillRect(i, 0, 1, 1);
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.NearestFilter;
  tex.magFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  return tex;
}
const toonGradient = createToonGradient();

function toon(color, extra = {}) {
  return new THREE.MeshToonMaterial({ color, gradientMap: toonGradient, ...extra });
}

/* ============================================================
   SKY DOME (gradient) + FOG
   ============================================================ */
function createSkyTexture() {
  const canvas = document.createElement("canvas");
  canvas.width = 8; canvas.height = 256;
  const ctx = canvas.getContext("2d");
  const grad = ctx.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0.0, "#9fc7ff");   // sky blue top
  grad.addColorStop(0.45, "#c9d3ff"); // blue -> pink transition
  grad.addColorStop(0.72, "#ffc4e6"); // pink
  grad.addColorStop(1.0, "#ffe1b3");  // warm horizon
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 8, 256);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const skyGeo = new THREE.SphereGeometry(300, 24, 24);
const skyMat = new THREE.MeshBasicMaterial({ map: createSkyTexture(), side: THREE.BackSide, fog: false });
const skyDome = new THREE.Mesh(skyGeo, skyMat);
scene.add(skyDome);

scene.fog = new THREE.Fog(0xffd7ea, 40, 220);

/* ============================================================
   LIGHTING
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xfff2f8, 0xffd9ec, 0.9);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(40, 60, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -100;
sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100;
sun.shadow.camera.bottom = -100;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 250;
sun.shadow.bias = -0.0015;
scene.add(sun);
scene.add(sun.target);

const fill = new THREE.DirectionalLight(0xbcd4ff, 0.4);
fill.position.set(-30, 20, -30);
scene.add(fill);

/* ============================================================
   PASTEL PALETTE
   ============================================================ */
const PASTELS = [0xffc4dd, 0xbfe3ff, 0xc4ffe0, 0xe0c4ff, 0xfff2cf, 0xffe0c4, 0xc4e8ff];
const WINDOW_COLORS = [0xfff59a, 0x9adcff, 0xffb0d8, 0xb0ffc9];
function randPastel() { return PASTELS[Math.floor(Math.random() * PASTELS.length)]; }

/* ============================================================
   GROUND, SIDEWALKS, ROADS
   ============================================================ */
const CITY_HALF = 100;
const groundGeo = new THREE.PlaneGeometry(CITY_HALF * 2 + 20, CITY_HALF * 2 + 20);
const groundMat = toon(0xffe9f2); // cream/pink sidewalk base
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const BLOCK_SPACING = 22;
const ROAD_WIDTH = 6;
const GRID = 2; // blocks from -GRID..GRID on each axis

const roadMat = toon(0xcdb9d6);
const stripeMat = toon(0xffffff, { emissive: 0xffffff, emissiveIntensity: 0.15 });

function addRoad(isXAxis, coord) {
  const length = (GRID * 2 + 1) * BLOCK_SPACING + 10;
  const geo = new THREE.PlaneGeometry(isXAxis ? ROAD_WIDTH : length, isXAxis ? length : ROAD_WIDTH);
  const road = new THREE.Mesh(geo, roadMat);
  road.rotation.x = -Math.PI / 2;
  road.position.y = 0.01;
  if (isXAxis) road.position.x = coord; else road.position.z = coord;
  road.receiveShadow = true;
  scene.add(road);

  // lane stripes
  const stripeCount = 16;
  for (let i = 0; i < stripeCount; i++) {
    const t = (i / stripeCount - 0.5) * length;
    const sGeo = new THREE.BoxGeometry(isXAxis ? 0.25 : 1.4, 0.02, isXAxis ? 1.4 : 0.25);
    const stripe = new THREE.Mesh(sGeo, stripeMat);
    stripe.position.y = 0.02;
    if (isXAxis) { stripe.position.x = coord; stripe.position.z = t; }
    else { stripe.position.z = coord; stripe.position.x = t; }
    scene.add(stripe);
  }
}
for (let i = -GRID; i <= GRID + 1; i++) {
  const coord = (i - 0.5) * BLOCK_SPACING;
  addRoad(true, coord);
  addRoad(false, coord);
}

/* ============================================================
   KANJI SIGN TEXTURE
   ============================================================ */
const SIGN_WORDS = ["カフェ", "寿司", "ラーメン", "マンガ", "アニメ", "ゲーム", "神社", "学校", "花屋", "魔法"];
function createSignTexture(text) {
  const canvas = document.createElement("canvas");
  canvas.width = 256; canvas.height = 128;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff6e8";
  ctx.fillRect(0, 0, 256, 128);
  ctx.strokeStyle = "#d6316c";
  ctx.lineWidth = 8;
  ctx.strokeRect(4, 4, 248, 120);
  ctx.fillStyle = "#c1245c";
  ctx.font = "bold 46px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, 128, 68);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* ============================================================
   BUILDINGS (with collision registry)
   ============================================================ */
const buildingColliders = [];

function createBuilding(cx, cz) {
  const w = 5 + Math.random() * 4;
  const d = 5 + Math.random() * 4;
  const h = 6 + Math.random() * 12;
  const color = randPastel();

  const group = new THREE.Group();
  group.position.set(cx, 0, cz);

  const bodyGeo = new THREE.BoxGeometry(w, h, d);
  const body = new THREE.Mesh(bodyGeo, toon(color));
  body.position.y = h / 2;
  body.castShadow = true;
  body.receiveShadow = true;
  group.add(body);

  // pitched roof (pyramid via 4-sided cone)
  const roofColor = randPastel();
  const roofGeo = new THREE.ConeGeometry(Math.max(w, d) * 0.75, 2.4, 4);
  const roof = new THREE.Mesh(roofGeo, toon(roofColor));
  roof.rotation.y = Math.PI / 4;
  roof.position.y = h + 1.2;
  roof.castShadow = true;
  group.add(roof);

  // window panels on the two faces along Z
  const winMat = new THREE.MeshBasicMaterial({ color: WINDOW_COLORS[Math.floor(Math.random() * WINDOW_COLORS.length)] });
  const rows = Math.max(1, Math.floor(h / 2.2));
  const cols = Math.max(1, Math.floor(w / 1.4));
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (Math.random() < 0.25) continue; // some dark windows
      const wGeo = new THREE.PlaneGeometry(0.55, 0.7);
      const winFront = new THREE.Mesh(wGeo, winMat);
      const px = -w / 2 + (c + 0.5) * (w / cols);
      const py = 1 + r * 2.2;
      winFront.position.set(px, py, d / 2 + 0.01);
      group.add(winFront);
      const winBack = winFront.clone();
      winBack.position.z = -d / 2 - 0.01;
      winBack.rotation.y = Math.PI;
      group.add(winBack);
    }
  }

  // roof-mounted kanji sign (some buildings)
  if (Math.random() < 0.55) {
    const word = SIGN_WORDS[Math.floor(Math.random() * SIGN_WORDS.length)];
    const signMat = new THREE.MeshBasicMaterial({ map: createSignTexture(word) });
    const signGeo = new THREE.PlaneGeometry(3.2, 1.6);
    const sign = new THREE.Mesh(signGeo, signMat);
    sign.position.set(0, h + 0.4, d / 2 + 0.4);
    group.add(sign);
    const signBack = new THREE.Mesh(signGeo, signMat);
    signBack.position.set(0, h + 0.4, -d / 2 - 0.4);
    signBack.rotation.y = Math.PI;
    group.add(signBack);
  }

  scene.add(group);
  buildingColliders.push({ x: cx, z: cz, halfW: w / 2 + 0.3, halfD: d / 2 + 0.3 });
}

for (let ix = -GRID; ix <= GRID; ix++) {
  for (let iz = -GRID; iz <= GRID; iz++) {
    if (ix === 0 && iz === 0) continue; // reserve center plaza for torii gate
    const jitterX = (Math.random() - 0.5) * 3;
    const jitterZ = (Math.random() - 0.5) * 3;
    createBuilding(ix * BLOCK_SPACING + jitterX, iz * BLOCK_SPACING + jitterZ);
  }
}

/* ============================================================
   SAKURA TREES
   ============================================================ */
function createSakuraTree(x, z) {
  const group = new THREE.Group();
  const trunkGeo = new THREE.CylinderGeometry(0.18, 0.26, 2.4, 6);
  const trunk = new THREE.Mesh(trunkGeo, toon(0x8a5a44));
  trunk.position.y = 1.2;
  trunk.castShadow = true;
  group.add(trunk);

  const foliageColors = [0xffb6d9, 0xffc9e3, 0xffa3cf];
  for (let i = 0; i < 5; i++) {
    const r = 0.9 + Math.random() * 0.4;
    const geo = new THREE.SphereGeometry(r, 8, 8);
    const mat = toon(foliageColors[Math.floor(Math.random() * foliageColors.length)]);
    const sphere = new THREE.Mesh(geo, mat);
    sphere.position.set((Math.random() - 0.5) * 1.4, 2.6 + (Math.random() - 0.5) * 0.8, (Math.random() - 0.5) * 1.4);
    sphere.castShadow = true;
    group.add(sphere);
  }
  group.position.set(x, 0, z);
  scene.add(group);
  buildingColliders.push({ x, z, halfW: 0.5, halfD: 0.5 });
}

for (let i = -GRID; i <= GRID + 1; i++) {
  const coord = (i - 0.5) * BLOCK_SPACING;
  for (let j = -GRID * BLOCK_SPACING; j <= GRID * BLOCK_SPACING; j += BLOCK_SPACING) {
    if (Math.random() < 0.7) createSakuraTree(coord + (ROAD_WIDTH / 2 + 1.2), j + (Math.random() - 0.5) * 6);
    if (Math.random() < 0.7) createSakuraTree(j + (Math.random() - 0.5) * 6, coord + (ROAD_WIDTH / 2 + 1.2));
  }
}

/* ============================================================
   TORII GATE (center plaza)
   ============================================================ */
function createToriiGate() {
  const group = new THREE.Group();
  const red = toon(0xe0463f);

  const pillarGeo = new THREE.CylinderGeometry(0.35, 0.4, 6, 10);
  const pillarL = new THREE.Mesh(pillarGeo, red);
  pillarL.position.set(-3, 3, 0);
  pillarL.castShadow = true;
  const pillarR = pillarL.clone();
  pillarR.position.x = 3;
  group.add(pillarL, pillarR);

  const topBeamGeo = new THREE.BoxGeometry(8.4, 0.5, 0.9);
  const topBeam = new THREE.Mesh(topBeamGeo, red);
  topBeam.position.set(0, 6.1, 0);
  topBeam.castShadow = true;
  group.add(topBeam);

  const capGeo = new THREE.BoxGeometry(9.2, 0.4, 1.3);
  const cap = new THREE.Mesh(capGeo, red);
  cap.position.set(0, 6.55, 0);
  group.add(cap);

  const secondBeamGeo = new THREE.BoxGeometry(7.6, 0.35, 0.5);
  const secondBeam = new THREE.Mesh(secondBeamGeo, red);
  secondBeam.position.set(0, 5.0, 0);
  group.add(secondBeam);

  scene.add(group);
}
createToriiGate();

/* ============================================================
   CLOUDS
   ============================================================ */
const clouds = [];
function createCloud(x, y, z) {
  const group = new THREE.Group();
  const mat = toon(0xffffff);
  for (let i = 0; i < 5; i++) {
    const r = 1.4 + Math.random() * 1.2;
    const geo = new THREE.SphereGeometry(r, 8, 8);
    const s = new THREE.Mesh(geo, mat);
    s.position.set((Math.random() - 0.5) * 4, (Math.random() - 0.5) * 1, (Math.random() - 0.5) * 2.4);
    group.add(s);
  }
  group.position.set(x, y, z);
  group.userData.speed = 0.3 + Math.random() * 0.5;
  scene.add(group);
  clouds.push(group);
}
for (let i = 0; i < 12; i++) {
  createCloud((Math.random() - 0.5) * 200, 30 + Math.random() * 15, (Math.random() - 0.5) * 200);
}

/* ============================================================
   FALLING PETALS
   ============================================================ */
const petals = [];
const petalGeo = new THREE.PlaneGeometry(0.28, 0.28);
const petalMat = toon(0xffb0d4, { side: THREE.DoubleSide });
for (let i = 0; i < 160; i++) {
  const petal = new THREE.Mesh(petalGeo, petalMat);
  petal.position.set((Math.random() - 0.5) * 180, Math.random() * 40, (Math.random() - 0.5) * 180);
  petal.userData.fallSpeed = 0.6 + Math.random() * 0.8;
  petal.userData.sway = Math.random() * Math.PI * 2;
  petal.userData.swaySpeed = 0.5 + Math.random() * 1.0;
  petal.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
  scene.add(petal);
  petals.push(petal);
}

/* ============================================================
   ANIME CHARACTER
   ============================================================ */
const SKIN = toon(0xffe1c4);
const HAIR = toon(0x3d3579);        // indigo hair
const HAIR_HL = toon(0x8a6fd8);     // violet highlight
const BLAZER = toon(0x1f2a52);      // navy blazer
const COLLAR = toon(0xffffff);
const TIE = toon(0xd6293f);
const PANTS = toon(0x22223a);
const SHOES = toon(0x181820);
const EYE_WHITE = toon(0xffffff);
const EYE_IRIS = toon(0x4d8fe0);
const EYE_PUPIL = toon(0x111111);
const BLUSH = new THREE.MeshBasicMaterial({ color: 0xff9ec7, transparent: true, opacity: 0.55 });

function makeEye(x) {
  const eyeGroup = new THREE.Group();
  const white = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 12), EYE_WHITE);
  white.scale.set(1, 1.3, 0.6);
  eyeGroup.add(white);

  const iris = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 10), EYE_IRIS);
  iris.position.z = 0.09;
  eyeGroup.add(iris);

  const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), EYE_PUPIL);
  pupil.position.z = 0.13;
  eyeGroup.add(pupil);

  const hl1 = new THREE.Mesh(new THREE.SphereGeometry(0.028, 6, 6), EYE_WHITE);
  hl1.position.set(0.03, 0.05, 0.15);
  eyeGroup.add(hl1);

  const hl2 = new THREE.Mesh(new THREE.SphereGeometry(0.015, 6, 6), EYE_WHITE);
  hl2.position.set(-0.03, -0.04, 0.15);
  eyeGroup.add(hl2);

  eyeGroup.position.set(x, 0.05, 0.34);
  return eyeGroup;
}

function buildCharacter() {
  const char = new THREE.Group();

  // ---- Torso pivot (used for bob) ----
  const torso = new THREE.Group();
  torso.position.y = 1.05;
  char.add(torso);

  const torsoMesh = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.7, 0.36), BLAZER);
  torsoMesh.position.y = 0.35;
  torsoMesh.castShadow = true;
  torso.add(torsoMesh);

  // white V collar
  const collar = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.22, 0.05), COLLAR);
  collar.position.set(0, 0.62, 0.19);
  torso.add(collar);

  // red tie
  const tie = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.32, 4), TIE);
  tie.position.set(0, 0.42, 0.2);
  tie.rotation.x = Math.PI;
  torso.add(tie);
  const tieKnot = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), TIE);
  tieKnot.position.set(0, 0.58, 0.2);
  torso.add(tieKnot);

  // ---- Head group ----
  const head = new THREE.Group();
  head.position.y = 0.98;
  torso.add(head);

  const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.34, 16, 16), SKIN);
  headMesh.castShadow = true;
  head.add(headMesh);

  // eyebrows
  const browGeo = new THREE.BoxGeometry(0.12, 0.03, 0.03);
  const browMat = HAIR;
  const browL = new THREE.Mesh(browGeo, browMat);
  browL.position.set(-0.12, 0.16, 0.31);
  browL.rotation.z = 0.15;
  head.add(browL);
  const browR = browL.clone();
  browR.position.x = 0.12;
  browR.rotation.z = -0.15;
  head.add(browR);

  // eyes
  head.add(makeEye(-0.12));
  head.add(makeEye(0.12));

  // mouth
  const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.02, 0.02), toon(0xb5586a));
  mouth.position.set(0, -0.1, 0.33);
  head.add(mouth);

  // blush
  const blushGeo = new THREE.CircleGeometry(0.055, 10);
  const blushL = new THREE.Mesh(blushGeo, BLUSH);
  blushL.position.set(-0.2, -0.04, 0.27);
  blushL.rotation.y = -0.5;
  head.add(blushL);
  const blushR = new THREE.Mesh(blushGeo, BLUSH);
  blushR.position.set(0.2, -0.04, 0.27);
  blushR.rotation.y = 0.5;
  head.add(blushR);

  // ---- Hair ----
  const hairGroup = new THREE.Group();
  head.add(hairGroup);

  const hairBase = new THREE.Mesh(new THREE.SphereGeometry(0.36, 14, 14, 0, Math.PI * 2, 0, Math.PI * 0.62), HAIR);
  hairBase.position.y = 0.02;
  hairGroup.add(hairBase);

  // spikes
  const bangs = new THREE.Group();
  hairGroup.add(bangs);
  for (let i = 0; i < 7; i++) {
    const angle = (i / 6 - 0.5) * Math.PI * 0.9;
    const spike = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.28, 5), i % 2 === 0 ? HAIR : HAIR_HL);
    spike.position.set(Math.sin(angle) * 0.28, 0.28 + Math.cos(angle) * 0.08, Math.cos(angle) * 0.14 - 0.02);
    spike.rotation.z = -angle * 0.6;
    spike.rotation.x = -0.3;
    spike.castShadow = true;
    bangs.add(spike);
  }
  // ahoge (single antenna strand)
  const ahoge = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.42, 5), HAIR_HL);
  ahoge.position.set(0, 0.5, -0.02);
  ahoge.rotation.x = -0.55;
  bangs.add(ahoge);

  // ---- Arms (pivot at shoulder) ----
  function makeArm(sign) {
    const pivot = new THREE.Group();
    pivot.position.set(sign * 0.36, 0.62, 0);
    const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.07, 0.34, 8), BLAZER);
    upper.position.y = -0.17;
    upper.castShadow = true;
    pivot.add(upper);
    const lower = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.06, 0.3, 8), SKIN);
    lower.position.y = -0.44;
    lower.castShadow = true;
    pivot.add(lower);
    torso.add(pivot);
    return pivot;
  }
  const leftArm = makeArm(-1);
  const rightArm = makeArm(1);

  // ---- Legs (pivot at hip) ----
  function makeLeg(sign) {
    const pivot = new THREE.Group();
    pivot.position.set(sign * 0.15, 0, 0);
    const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.085, 0.36, 8), PANTS);
    upper.position.y = -0.18;
    upper.castShadow = true;
    pivot.add(upper);
    const lower = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.075, 0.34, 8), PANTS);
    lower.position.y = -0.5;
    lower.castShadow = true;
    pivot.add(lower);
    const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.09, 0.22), SHOES);
    shoe.position.set(0, -0.7, 0.04);
    shoe.castShadow = true;
    pivot.add(shoe);
    char.add(pivot);
    pivot.position.y = 0.7;
    return pivot;
  }
  const leftLeg = makeLeg(-1);
  const rightLeg = makeLeg(1);

  scene.add(char);
  return { char, torso, head, bangs, leftArm, rightArm, leftLeg, rightLeg };
}

const character = buildCharacter();
character.char.position.set(0, 0, 8);

/* ============================================================
   INPUT STATE
   ============================================================ */
const keys = new Set();
window.addEventListener("keydown", (e) => keys.add(e.key.toLowerCase()));
window.addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));

let dragging = false;
let lastPointer = { x: 0, y: 0 };
let cameraYaw = 0;
let cameraPitch = 0.35;
let cameraDistance = 9;
const MIN_DIST = 4, MAX_DIST = 30;
const MIN_PITCH = -0.3, MAX_PITCH = 1.0;

function onDragStart(x, y) { dragging = true; lastPointer = { x, y }; }
function onDragMove(x, y) {
  if (!dragging) return;
  const dx = x - lastPointer.x;
  const dy = y - lastPointer.y;
  lastPointer = { x, y };
  cameraYaw -= dx * 0.006;
  // vertical drag inverted: drag up (dy negative) -> camera tilts down (pitch decreases)
  cameraPitch += dy * 0.006;
  cameraPitch = Math.max(MIN_PITCH, Math.min(MAX_PITCH, cameraPitch));
}
function onDragEnd() { dragging = false; }

renderer.domElement.addEventListener("mousedown", (e) => onDragStart(e.clientX, e.clientY));
window.addEventListener("mousemove", (e) => onDragMove(e.clientX, e.clientY));
window.addEventListener("mouseup", onDragEnd);

renderer.domElement.addEventListener("touchstart", (e) => {
  if (e.touches.length === 1) onDragStart(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });
renderer.domElement.addEventListener("touchmove", (e) => {
  if (e.touches.length === 1) onDragMove(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });
renderer.domElement.addEventListener("touchend", onDragEnd);

renderer.domElement.addEventListener("wheel", (e) => {
  cameraDistance += e.deltaY * 0.01;
  cameraDistance = Math.max(MIN_DIST, Math.min(MAX_DIST, cameraDistance));
}, { passive: true });

/* ============================================================
   MOVEMENT / COLLISION
   ============================================================ */
let yaw = 0; // character facing angle
const TURN_RATE = THREE.MathUtils.degToRad(30); // rad/sec
const WALK_SPEED = 3.2;
const RUN_MULT = 2.0;
const CHAR_RADIUS = 0.5;
const CITY_CLAMP = 95;

function collides(x, z) {
  for (const b of buildingColliders) {
    if (Math.abs(x - b.x) < b.halfW + CHAR_RADIUS && Math.abs(z - b.z) < b.halfD + CHAR_RADIUS) {
      return true;
    }
  }
  return false;
}

let walkPhase = 0;
const camPos = new THREE.Vector3();
const camTargetPos = new THREE.Vector3();

/* ============================================================
   ANIMATION LOOP
   ============================================================ */
let started = false;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();

  if (!started) {
    started = true;
    const loading = document.getElementById("loading");
    loading.classList.add("fade-out");
    setTimeout(() => loading.remove(), 700);
  }

  // --- continuous turning ---
  if (keys.has("a")) yaw += TURN_RATE * dt;   // A = turn right (continuous)
  if (keys.has("d")) yaw -= TURN_RATE * dt;   // D = turn left (continuous)

  // --- forward vector (world space, yaw-driven) ---
  const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
  const running = keys.has("shift");
  const speed = WALK_SPEED * (running ? RUN_MULT : 1);

  let moving = false;
  let moveX = 0, moveZ = 0;
  if (keys.has("w")) { moveX += forward.x * speed * dt; moveZ += forward.z * speed * dt; moving = true; }
  if (keys.has("s")) { moveX -= forward.x * speed * dt; moveZ -= forward.z * speed * dt; moving = true; }

  const pos = character.char.position;
  const nx = pos.x + moveX;
  if (!collides(nx, pos.z)) pos.x = THREE.MathUtils.clamp(nx, -CITY_CLAMP, CITY_CLAMP);
  const nz = pos.z + moveZ;
  if (!collides(pos.x, nz)) pos.z = THREE.MathUtils.clamp(nz, -CITY_CLAMP, CITY_CLAMP);

  // face movement direction
  const targetQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
  character.char.quaternion.slerp(targetQuat, 1 - Math.pow(0.0001, dt));

  // --- walk cycle animation ---
  const freq = running ? 10 : 6;
  if (moving) {
    walkPhase += dt * freq;
  } else {
    walkPhase += dt * freq * 0.0; // hold phase when idle
  }
  const swing = moving ? Math.sin(walkPhase) * (running ? 0.9 : 0.55) : 0;
  const decay = 1 - Math.pow(0.0001, dt);

  character.leftArm.rotation.x = THREE.MathUtils.lerp(character.leftArm.rotation.x, swing, decay);
  character.rightArm.rotation.x = THREE.MathUtils.lerp(character.rightArm.rotation.x, -swing, decay);
  character.leftLeg.rotation.x = THREE.MathUtils.lerp(character.leftLeg.rotation.x, -swing, decay);
  character.rightLeg.rotation.x = THREE.MathUtils.lerp(character.rightLeg.rotation.x, swing, decay);

  const bob = moving ? Math.abs(Math.sin(walkPhase * 2)) * (running ? 0.09 : 0.05) : 0;
  character.torso.position.y = THREE.MathUtils.lerp(character.torso.position.y, 1.05 + bob, decay);

  // hair sway
  character.bangs.rotation.z = Math.sin(t * 1.6) * 0.04;

  // --- camera (decoupled orbit around character, smooth follow) ---
  const cy = Math.sin(cameraPitch);
  const horiz = Math.cos(cameraPitch);
  camTargetPos.set(
    pos.x + Math.sin(cameraYaw) * horiz * cameraDistance,
    1.4 + cy * cameraDistance,
    pos.z + Math.cos(cameraYaw) * horiz * cameraDistance
  );
  camPos.lerp(camTargetPos, 1 - Math.pow(0.0001, dt));
  camera.position.copy(camPos);
  camera.lookAt(pos.x, 1.3, pos.z);

  // sun follows character loosely to keep shadows in view
  sun.position.set(pos.x + 40, 60, pos.z + 20);
  sun.target.position.set(pos.x, 0, pos.z);

  // --- clouds drift ---
  for (const c of clouds) {
    c.position.x += c.userData.speed * dt;
    if (c.position.x > 120) c.position.x = -120;
  }

  // --- falling petals ---
  for (const p of petals) {
    p.position.y -= p.userData.fallSpeed * dt;
    p.userData.sway += p.userData.swaySpeed * dt;
    p.position.x += Math.sin(p.userData.sway) * 0.35 * dt;
    p.rotation.x += dt * 0.6;
    p.rotation.z += dt * 0.4;
    if (p.position.y < 0) {
      p.position.y = 35 + Math.random() * 5;
      p.position.x = pos.x + (Math.random() - 0.5) * 90;
      p.position.z = pos.z + (Math.random() - 0.5) * 90;
    }
  }

  // keep skydome centered on camera
  skyDome.position.copy(camera.position);

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
